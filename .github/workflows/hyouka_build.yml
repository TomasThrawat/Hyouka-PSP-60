name: Hyouka PSP 60 Minimal APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Apply Hyouka minimal play-only profile
        run: python3 scripts/apply-hyouka-performance.py

      - name: Verify minimal configuration
        run: |
          grep -n 'AndroidFramerateMode' Core/Config.cpp
          grep -n 'InflightFrames' Core/Config.cpp
          grep -n 'RenderDuplicateFrames' Core/Config.cpp
          grep -n 'LowLatencyPresent' Core/Config.cpp
          grep -n 'Enable Logging' Core/Config.cpp
          grep -n 'RemoteDebuggerOnStartup' Core/Config.cpp
          grep -n 'RemoteDebuggerLocal' Core/Config.cpp
          grep -n 'LogFrameDrops' Core/Config.cpp
          grep -n 'GpuLogProfiler' Core/Config.cpp
          grep -n 'ShowDeveloperMenu' Core/Config.cpp
          grep -n 'isDebuggable = false' android/build.gradle.kts
          grep -n 'isJniDebuggable = false' android/build.gradle.kts

      - name: Build Android optimized APK
        run: ./gradlew --no-daemon --stacktrace assembleNormalOptimized

      - name: Collect APK
        run: |
          mkdir -p dist
          find android/build -type f -name '*.apk' -print -exec cp {} dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: hyouka-psp-60-minimal
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hyouka-psp-60-minimal-${{ github.run_number }}"
          gh release create "$tag" dist/*.apk             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "Hyouka PSP 60 Minimal ${{ github.run_number }}"             --notes "Minimal Android play-only build from PPSSPP source at commit ${{ github.sha }}. Debug logging, file logging, developer menu, debug overlay, dropped-frame logging, GPU log profiler, and remote debugger are disabled by default."
