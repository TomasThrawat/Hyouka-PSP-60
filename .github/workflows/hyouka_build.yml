name: Hyouka PSP 60 OPPO A73 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Apply Hyouka OPPO A73 profile
        run: python3 scripts/apply-hyouka-a73.py

      - name: Verify complete A73 profile
        run: |
          grep -n 'AndroidFramerateMode.*), 3,' Core/Config.cpp
          grep -n 'InflightFrames.*), 1,' Core/Config.cpp
          grep -n 'RenderDuplicateFrames.*true' Core/Config.cpp
          grep -n 'LowLatencyPresent.*true' Core/Config.cpp
          grep -n 'Enable Logging.*false' Core/Config.cpp
          grep -n 'CheckForNewVersion.*false' Core/Config.cpp
          grep -n 'applicationId = "com.hyouka.psp60"' android/build.gradle.kts
          grep -n 'isDebuggable = false' android/build.gradle.kts
          grep -n 'isJniDebuggable = false' android/build.gradle.kts
          grep -n '<profileable android:shell="false" android:enabled="false" />' android/AndroidManifest.xml
          test -f android/hyouka-a73-profile.txt

      - name: Build Android optimized APK
        run: ./gradlew --no-daemon --stacktrace assembleNormalOptimized

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          mapfile -d '' apks < <(find android/build -type f -name '*.apk' -print0)

          if (( ${#apks[@]} == 0 )); then
            echo "ERROR: No APK was produced."
            echo "APK/build outputs:"
            find android/build -maxdepth 6 -type f \( -name '*.apk' -o -name '*.aab' \) -print | sort || true
            echo "Recent build output directories:"
            find android/build -maxdepth 4 -type d -print | sort | tail -n 100 || true
            exit 1
          fi

          for apk in "${apks[@]}"; do
            cp -- "$apk" dist/
          done

          echo "Collected APK files:"
          find dist -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: hyouka-psp-60-oppo-a73
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="hyouka-psp-60-oppo-a73-${{ github.run_number }}"
          gh release create "$tag" dist/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Hyouka PSP 60 OPPO A73 ${{ github.run_number }}" \
            --notes "Device-targeted Android build for OPPO A73 CPH2095 (Snapdragon 662 / Adreno 610 / 60 Hz)."
